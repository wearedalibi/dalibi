name: CI

# Les tests s'exécutent avant tout merge (sur la pull request) et après coup
# sur les branches protégées, pour couvrir aussi les pushs directs.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Une exécution obsolète est annulée dès qu'un nouveau commit arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # sqlite : la suite tourne sur une base en mémoire (voir phpunit.xml)
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd, intl, bcmath
          coverage: none

      # `.env` doit exister AVANT composer install : le script post-autoload-dump
      # (`package:discover`) boote l'application.
      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé applicative
        run: php artisan key:generate

      - name: Lancer la suite de tests
        run: php artisan test

  static-analysis:
    name: Analyse statique (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd, intl, bcmath
          coverage: none

      # `.env` doit exister AVANT composer install : le script post-autoload-dump
      # (`package:discover`) boote l'application.
      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé applicative
        run: php artisan key:generate

      - name: Lancer PHPStan
        run: composer analyse

  frontend:
    name: Front (types & build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Le build a besoin de PHP : le plugin Vite Wayfinder invoque `artisan`
      # pour générer les helpers de routes.
      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd, intl, bcmath
          coverage: none

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé applicative
        run: php artisan key:generate

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances front
        run: npm ci

      # Le build doit précéder le type-check : Wayfinder génère
      # `resources/js/{actions,routes,wayfinder}` (gitignorés) pendant la
      # compilation. Sans eux, tsc ne peut pas résoudre `@/routes`.
      - name: Compiler les assets
        run: npm run build

      - name: Vérifier les types
        run: npm run types
